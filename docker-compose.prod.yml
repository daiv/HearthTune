name: HearthTune
services:
  api:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: hearthtune_server
    restart: always
    env_file:
      - ./server/.env
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./server/storage/music:/app/server/storage/music
      - ./server/storage/artifacts:/app/server/storage/artifacts
      - ./common:/app/common:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    depends_on:
      - db
    networks:
      - hearthtune-net

  db:
    image: mongo:8.0
    container_name: hearthtune_db
    restart: always
    environment:
      - TZ=Europe/Madrid
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
    command: mongod --auth
    volumes:
      - mongo_data:/data/db
      - ./server/src/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - hearthtune-net

  caddy:
    image: caddy:latest
    container_name: hearthtune_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - hearthtune-net

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  hearthtune-net:
    driver: bridge
