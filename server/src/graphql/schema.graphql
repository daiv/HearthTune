type Song {
  id: ID!
  title: String
  duration: Int
  description: String
  played: Int
  local: Boolean
  source: String
  url: String
}
type Query {
  search (query: String!, limit:Int):[Song]
  getRelated(id:String, numberOfSongs:Int):[Song]
}
type Mutation {
  login(email:String!, password:String!):AuthPayLoad
}

type AuthPayLoad{
  accessToken: String!
  refreshToken:String!
}

type AccessToken{
  tokenId:String!
  userId:String!
}