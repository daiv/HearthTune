  type Song {
    id: ID!
    title: String
    duration: Int
    description: String
    played: Int
    local: Boolean
    provider: String
    url: String
  }
  type Playlist {
      id: ID!
      userId: String!
      title: String!
      songs: [Song!]!
  }

  type AuthPayLoad{
    accessToken: String!
    refreshToken:String!
  }

  type AccessToken{
    tokenId:String!
    userId:String!
  }

  type SignedUrl{
    signedUrl:String
  }

  type User{
    nick:String
  }
  
  type Query {
    search (query: String!, limit:Int):[Song]
    searchLocally(query:String!): [Song]
    searchDeep(query:String!, limit:Int):[Song]
    getRelated(id:ID!, numberOfSongs:Int):[Song]
    getSignedUrl(songId:ID!, provider:String!): SignedUrl!
    getNick:User!
    isLiked(songId:String!):Boolean!
    getLikedSongsByUser:[Song!]!

    getPlaylistsByUserId: [Playlist!]!
    getPlaylistById(id: ID!): Playlist
  }

  type Mutation {
    login(email:String!, password:String!, deviceId:String!, deviceInfo:String):AuthPayLoad
    logout(jti:String!):Boolean
    refreshTokens(token:String!): AuthPayLoad
    changeNick(newNick:String!):User!
    changePassword(oldPass:String!, newPass:String!):Boolean!
    toggleLikeSong(songId:String!):Boolean!

    savePlaylist(id: ID, title: String!, songs: [String!]!): Playlist
    removePlaylist(id: ID!): Boolean!
  }
